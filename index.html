<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로야구 매니저 PM 2026</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/pm-icon-32.png">
<link rel="icon" type="image/svg+xml" href="icons/pm-icon-small.svg">
<link rel="apple-touch-icon" href="icons/pm-icon-180.png">
<meta name="theme-color" content="#0b0f14">
<style>
:root{--bg:#0e1217;--panel:#171c23;--panel2:#1f262f;--line:#28303a;--text:#e8edf2;--mute:#8d99a6;--acc:#C30452;--red:#e5383b;--good:#3fb950;--bad:#f85149;--warn:#d29922;--blue:#58a6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 "Pretendard","Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:8px;padding:7px 14px;transition:border-color .15s,background .15s}
button:hover:not(:disabled){border-color:#4a5563;background:#252d37}
button:disabled{opacity:.4;cursor:default}
button.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
button.pri:hover:not(:disabled){background:#f04a4d;border-color:#f04a4d}
button.ghost{background:rgba(255,255,255,.04)}
select,input{font:inherit;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
/* ===== FM 스타일 셸 ===== */
#app{min-height:100vh;background:radial-gradient(1200px 420px at 50% -120px,color-mix(in srgb,var(--acc) 22%,transparent),transparent 70%),var(--bg)}
.tb{position:sticky;top:0;z-index:10}
.tb1{position:relative;z-index:2;display:flex;align-items:center;gap:6px;height:60px;padding:0 14px;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 92%,#000),color-mix(in srgb,var(--acc) 70%,#000));box-shadow:0 2px 10px rgba(0,0,0,.35)}
.tb1 .hist{display:flex;gap:4px;margin-right:6px}
.tb1 .hist button{width:38px;height:40px;padding:0;font-size:22px;line-height:1;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.18);color:#fff}
.tb1 .hist button:hover:not(:disabled){background:rgba(0,0,0,.32)}
.tb1 .tcrest{display:flex;align-items:center;cursor:pointer;margin-right:8px;background:none;border:0;padding:0}
.menus{display:flex;gap:2px;height:100%}
.menu{position:relative;display:flex;align-items:center}
.menu>button{background:none;border:0;border-radius:0;color:#fff;font-weight:700;font-size:16px;padding:0 12px;height:60px;display:flex;align-items:center;gap:6px;opacity:.88}
.menu>button:hover,.menu:focus-within>button{opacity:1;background:rgba(0,0,0,.15)}
.menu.on>button{opacity:1;box-shadow:inset 0 -3px 0 #fff}
.menu>button svg{opacity:.7}
.dd{display:none;position:absolute;top:60px;left:0;min-width:200px;background:#161b22;border:1px solid var(--line);border-radius:0 0 10px 10px;box-shadow:0 12px 28px rgba(0,0,0,.5);padding:6px 0}
.menu:hover .dd,.menu:focus-within .dd{display:block}
.dd a{display:block;padding:10px 16px;color:#d5dce3;text-decoration:none;font-size:14px}
.dd a:hover{background:#222a33;color:#fff}
.dd a.on{color:#fff;font-weight:700;box-shadow:inset 3px 0 0 var(--acc)}
.tb1 .sp,.tb2 .sp{flex:1}
.datebox{display:flex;align-items:center;gap:12px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:6px 12px;color:#fff;max-width:340px}
.datebox b{display:block;font-size:15px;font-weight:800;white-space:nowrap}
.datebox span{display:block;font-size:12px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datebox .rec{background:#fff;color:#111;border-radius:6px;padding:3px 8px;font-weight:800;font-size:13px;white-space:nowrap}
.cont{display:flex;gap:6px;align-items:stretch;height:44px}
.cont button{border-color:rgba(255,255,255,.2);background:rgba(0,0,0,.22);color:#fff;font-weight:700}
.cont .go{min-width:170px;display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:16px;background:#fff;color:#111;border-color:#fff}
.cont .go:hover:not(:disabled){background:#f1f1f1;border-color:#f1f1f1}
.cont .go.live{background:var(--red);color:#fff;border-color:var(--red)}
.tb2{display:flex;align-items:center;gap:8px;height:46px;padding:0 18px;background:rgba(10,13,17,.82);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.subtabs{display:flex;gap:4px;height:100%;overflow-x:auto}
.subtabs a{display:flex;align-items:center;padding:0 12px;color:#aab4bf;text-decoration:none;font-size:14px;white-space:nowrap;height:100%}
.subtabs a:hover{color:#fff}
.subtabs a.on{color:#fff;font-weight:700;box-shadow:inset 0 -2px 0 #fff}
.subtabs .crumb{white-space:nowrap;color:#fff;font-weight:800;padding-right:14px;margin-right:4px;border-right:1px solid var(--line);display:flex;align-items:center}
.quick{display:flex;gap:6px}
.quick button{padding:5px 11px;font-size:13px;display:flex;align-items:center;gap:6px;background:#1a2028}
.quick .n{background:var(--acc);color:#fff;border-radius:9px;padding:0 6px;font-size:11px;font-weight:800}
.content{padding:22px 24px;max-width:1600px;margin:0 auto}
/* 공통 패널 */
.panel{background:rgba(22,27,34,.92);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel>h3,.card>h3{display:flex;align-items:center;justify-content:space-between}
.lnk{color:#fff;text-decoration:underline;text-underline-offset:3px;text-decoration-color:color-mix(in srgb,var(--acc) 80%,#fff);font-weight:700;font-size:14px;cursor:pointer;background:none;border:0;padding:0}
.stars{position:relative;display:inline-block;font-size:15px;letter-spacing:1px;line-height:1;white-space:nowrap}
.stars .bg{color:#3a434e}.stars .fg{position:absolute;left:0;top:0;overflow:hidden;color:#f2c14e}
.grade{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;border:2px solid currentColor;font-weight:800;font-size:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:700;background:#1f6f43;color:#d8ffe6}
.tag.me{background:var(--acc);color:#fff}.tag.inj{background:#a8551c;color:#fff}.tag.fo{background:#2b4a75;color:#d9e9ff}
.panel svg[aria-label='팀 전력 레이더']{flex:none}
.pn{display:flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;cursor:pointer}
.pn:hover b{text-decoration:underline;color:#fff}
.pn svg{border-radius:7px}
tr.click{cursor:pointer}
/* 홈 대시보드 */
.dash{display:grid;grid-template-columns:minmax(300px,1fr) minmax(0,1.9fr) minmax(280px,.95fr);gap:16px;align-items:start}
.dcol{display:grid;gap:16px;min-width:0}
.mid2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px}
.mtabs{display:flex;gap:4px;margin:4px 0 10px}
.mtabs button{padding:5px 12px;font-size:13px}
.mtabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.msg{display:block;text-decoration:none;color:inherit;padding:12px 14px;border-bottom:1px solid #222a33;cursor:pointer;border-left:3px solid transparent}
.msg:hover{background:#1d242d}
.msg.unread{border-left-color:var(--acc)}
.msg .f{display:flex;justify-content:space-between;color:var(--mute);font-size:12.5px}
.msg .t{font-size:15px;margin-top:3px;color:#fff}
.msg.read .t{color:#9aa5b1}
.msg .chip{border:1px solid #3a4553;border-radius:4px;padding:0 6px;font-size:11.5px;color:#b8c2cc}
.dhead{background:#11161c;color:var(--mute);font-size:12px;padding:6px 14px;border-bottom:1px solid #222a33}
.news-hero{border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#141a21;cursor:pointer}
.news-hero .sb{display:flex;align-items:center;justify-content:center;gap:22px;padding:22px 10px;background:linear-gradient(180deg,#232b36,#151b22);position:relative}
.news-hero .sc2{font-size:52px;font-weight:900;letter-spacing:-1px;color:#fff;font-variant-numeric:tabular-nums}
.news-hero .tx{padding:14px 16px}
.news-hero .tx b{font-size:17px;display:block;margin-bottom:6px}
.news-hero .tx p{margin:0;color:#b5c0cb;font-size:13.5px;line-height:1.6}
.nsmall{display:flex;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid #222a33;font-size:13.5px}
.fx td{padding:7px 6px;font-size:13.5px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:0}
.mrow{display:grid;grid-template-columns:1fr 54px 1fr;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px solid #222a33;font-size:14px}
.mrow .h{text-align:right;display:flex;justify-content:flex-end;gap:6px;align-items:center}
.mrow .a{display:flex;gap:6px;align-items:center}
.mrow .v{text-align:center;background:#11161c;border:1px solid var(--line);border-radius:6px;padding:4px 0;color:var(--mute);font-size:12px;font-weight:700}
.mrow.me{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.lead{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #222a33}
.lead .k{font-size:12px;color:var(--mute)} .lead b{margin-left:auto;font-size:18px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
.week .d{background:#11161c;border:1px solid var(--line);border-radius:6px;padding:6px 2px;min-height:74px;display:flex;flex-direction:column;align-items:center;gap:4px}
.week .d.today{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.big2{font-size:28px;font-weight:900;color:color-mix(in srgb,var(--acc) 55%,#fff);letter-spacing:-.5px}
/* 선수 프로필 (FM 스타일) */
.hero{display:flex;align-items:flex-end;gap:22px;padding:22px 24px 18px;margin:-22px -24px 18px;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 35%,#0b0f14),rgba(11,15,20,0));flex-wrap:wrap}
.hero .nm h1{margin:0;font-size:34px;font-weight:900;letter-spacing:-.5px}
.hero .nm .l2{color:#d3dae2;font-size:15px;margin-top:4px}
.hero .box{border-left:1px solid rgba(255,255,255,.15);padding:0 18px;min-height:64px;display:flex;flex-direction:column;justify-content:center;gap:3px;font-size:14px}
.hero .box .k{font-size:12px;color:#aab4bf}
.act{position:relative}
.act>summary{list-style:none;cursor:pointer;background:var(--acc);color:#fff;font-weight:700;border-radius:8px;padding:8px 16px;display:inline-flex;gap:8px;align-items:center}
.act>summary::-webkit-details-marker{display:none}
.act[open]>div{position:absolute;z-index:5;top:42px;left:0;min-width:200px;background:#161b22;border:1px solid var(--line);border-radius:8px;padding:6px;display:grid;gap:4px;box-shadow:0 12px 28px rgba(0,0,0,.5)}
.act[open]>div button{text-align:left;border:0;background:none}
.act[open]>div button:hover{background:#232b35}
.pbody{display:grid;grid-template-columns:minmax(240px,1fr) repeat(3,minmax(200px,1fr)) minmax(240px,1fr);gap:0;padding:0}
.pbody>div{padding:16px;border-right:1px solid var(--line);min-width:0}
.pbody>div:last-child{border-right:0}
.ah{font-size:12.5px;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:6px;margin:0 0 4px}
.at{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;font-size:14.5px;border-left:3px solid transparent}
.at:nth-child(odd){background:rgba(255,255,255,.025)}
.at.key{background:rgba(63,185,80,.13);border-left-color:#3fb950}
.at b{font-variant-numeric:tabular-nums;font-size:15px}
.legend2{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--mute);margin-top:10px}
.legend2 i{display:inline-block;width:10px;height:10px;background:#3fb950;margin-right:5px;vertical-align:-1px;border-radius:2px}
.role{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font-size:14px}
.role.on{background:color-mix(in srgb,var(--acc) 30%,transparent)}
.role .rb{width:16px;height:16px;border-radius:50%;border:2px solid #8d99a6;flex:none}
.role.on .rb{border-color:#fff;box-shadow:inset 0 0 0 3px #222;background:#fff}
.bcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:16px}
.bcards .wide{grid-column:span 2}
.word{font-weight:700}
@media (max-width:1280px){ .dash{grid-template-columns:minmax(0,1fr) minmax(0,1.6fr)} .dash>.dcol:last-child{grid-column:1/-1;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))} .pbody{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))} .pbody>div{border-bottom:1px solid var(--line)} }
@media (max-width:900px){ .dash,.mid2{grid-template-columns:1fr} .bcards .wide{grid-column:auto} }
h2{margin:0 0 16px;font-size:22px;font-weight:800;letter-spacing:-.3px}
h3{margin:0 0 12px;font-size:15px;color:#cfd6de;font-weight:700}
.eyebrow{font-size:12px;letter-spacing:4px;color:var(--mute);text-transform:uppercase;font-weight:600}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 9px;border-bottom:1px solid #222a33;text-align:left;white-space:nowrap}
th{color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--panel);cursor:pointer;font-size:12px}
tr.me td{background:color-mix(in srgb, var(--acc) 14%, transparent)}
tbody tr:hover td{background:#1c232b}
.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow:auto;max-height:70vh}
.mute{color:var(--mute)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:12px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.pill.tr{border-color:#2f5f8f;color:#a9cff5;background:rgba(88,166,255,.08)}
.pill.bad{border-color:#7a3530;color:#f3a69f;background:rgba(248,81,73,.08)}
.r{display:inline-block;min-width:28px;text-align:center;border-radius:6px;padding:1px 5px;font-weight:800;font-size:12.5px;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.meter{display:grid;grid-template-columns:90px 1fr 36px;gap:8px;align-items:center;margin:7px 0}
.attr{display:flex;justify-content:space-between;align-items:center;padding:5px 0}
.attr span:first-child{color:#cfd6de}
.mail{padding:11px 12px;border-bottom:1px solid #222a33;cursor:pointer;border-left:3px solid transparent}
.mail.unread{border-left-color:var(--red);background:rgba(229,56,59,.04)}
.mail:hover{background:var(--panel2)}
.mail .t{font-weight:600}
.body{white-space:pre-wrap;line-height:1.7}
.modal{position:fixed;inset:0;background:rgba(5,8,12,.72);display:flex;align-items:flex-start;justify-content:center;z-index:20;padding:30px 12px;overflow:auto}
.modal>div{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;width:min(920px,100%)}
.ls td,.ls th{text-align:center}
.log{max-height:320px;overflow:auto;font-size:13px;background:var(--bg);padding:8px;border-radius:8px}
.log div{padding:3px 0;border-bottom:1px dashed #222c36}
.sc{color:var(--mute);font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.lu td{padding:5px 6px;vertical-align:middle}
.lu tr.sel td{background:rgba(229,56,59,.14)}
.card.pick{border-color:var(--warn)}
.tac2{grid-template-columns:repeat(auto-fit,minmax(min(520px,100%),1fr))}
.tac2 .card{min-width:0}
.foot{color:var(--mute);font-size:12px;padding:20px 28px}
.big{font-size:28px;font-weight:800}
.tile{background:var(--panel2);border-radius:10px;padding:10px;text-align:center}
.tile .k{font-size:12px;color:var(--mute)} .tile .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
/* 타이틀 */
.title{position:relative;min-height:100vh;overflow:hidden;background:#0d1522}
.title svg.bg{position:absolute;inset:0;width:100%;height:100%}
.title .inner{position:relative;z-index:1;text-align:center;padding:12vh 20px 0}
.title .sub{font-size:19px;color:#c7d0da;margin:12px 0 26px;font-weight:600}
.title .btns{display:flex;gap:14px;justify-content:center}
.title .btns button{padding:13px 34px;font-size:17px;font-weight:800;border-radius:10px}
.title .btns .dark{background:rgba(10,14,20,.75);border-color:#3a4450}
.title .tf{position:absolute;bottom:22px;left:40px;right:40px;display:flex;justify-content:space-between;color:#aab4bf;font-size:13px;z-index:1}
.title .tf b{letter-spacing:3px;font-weight:600}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;padding:0 28px 28px;max-width:1360px;margin:auto}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;cursor:pointer;transition:transform .15s,border-color .15s}
.tcard:hover{transform:translateY(-3px);border-color:var(--c)}
.tcard .crestwrap{display:flex;justify-content:center;margin-bottom:10px}
/* 선수 프로필 */
.ph{display:flex;gap:18px;align-items:center;margin-bottom:18px}
.ph h1{margin:0;font-size:34px;font-weight:900;letter-spacing:-.5px}
.ph .info{color:#c3ccd6;font-size:15px;margin-left:8px;font-weight:500}
.ph .ca{margin-left:auto;text-align:right}
.ph .ca .n{font-size:44px;font-weight:900;letter-spacing:-1.5px;line-height:1}
.ph .ca .n small{font-size:26px;color:#aab4bf;font-weight:800}
.stack{display:flex;height:18px;border-radius:6px;overflow:hidden;background:#232a33}
.stack i{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* 실시간 중계 */
.lvwrap{position:fixed;inset:0;background:rgba(6,9,13,.94);z-index:30;overflow:auto;padding:18px}
.lv{max-width:1280px;margin:auto}
.lvls th,.lvls td{padding:5px 8px;font-size:13px}
.lvls .rr{font-weight:900;font-size:16px;color:#fff}
.lvls tr.atbat td{background:rgba(255,209,102,.06)}
.lvls th.curinn{color:#ffd166}
.lvmain{display:grid;grid-template-columns:minmax(260px,1fr) minmax(280px,1.05fr) minmax(260px,1fr);gap:14px;margin-top:12px}
.lvfield{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;background:radial-gradient(circle at 50% 70%,#17331f,#141a21 70%)}
.lvpitch{font-size:18px;min-height:28px;text-align:center}
.bso{display:grid;grid-template-columns:auto auto auto auto;gap:4px 6px;align-items:center;font-size:12px;font-weight:800;color:var(--mute)}
.bso{display:flex;gap:5px;align-items:center}
.bso span{margin-left:6px}
.bso i{display:inline-block;width:13px;height:13px;border-radius:50%}
.lvside{display:flex;flex-direction:column;gap:10px}
.lvcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.vs{text-align:center;font-weight:900;color:var(--mute);letter-spacing:4px}
.lvfeed{max-height:430px;overflow:auto}
.fd{padding:5px 0;border-bottom:1px solid #212831;font-size:13px}
.fd-pitch{color:#aab4bf;font-size:12px;padding-left:8px}
.fd-half{color:#ffd166;font-weight:800;padding-top:10px}
.fd-sub{color:#a9cff5}
.fd .cnt{display:inline-block;min-width:30px;color:var(--mute);font-variant-numeric:tabular-nums}
.lvbanner{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;color:#ffd166;text-shadow:0 4px 24px rgba(0,0,0,.8);z-index:2;white-space:nowrap;animation:pop .4s ease-out}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.6);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.livedot{width:10px;height:10px;border-radius:50%;background:var(--red);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
@media (max-width:900px){ .lvmain{grid-template-columns:1fr} }
@media (max-width:760px){
  .tb1{height:auto;flex-wrap:wrap;padding:8px}
  .menus{order:3;width:100%;overflow-x:auto;height:44px} .menu>button{height:44px;font-size:14px}
  .dd{top:44px}
  .datebox{max-width:none;flex:1}
  .cont{height:40px} .cont .go{min-width:0}
  .quick{display:none}
  .content{padding:14px}
  .hero{margin:-14px -14px 14px;padding:16px}
  .hero .box{border-left:0;padding:0}
  .g2,.g3{grid-template-columns:1fr}
  .title .tf{left:16px;right:16px}
}
/* =====================================================================
   PM 2026 디자인 시스템 — 최신 매니지먼트 게임 톤 (짙은 차콜, 유리 패널, 구단 컬러 포인트)
   위의 규칙을 덮어쓴다. 색은 토큰으로만 바꾼다.
   ===================================================================== */
:root{
  --bg:#090c11; --bg2:#0d1117;
  --panel:#11161d; --panel2:#18202a; --panel3:#1f2833;
  --line:rgba(255,255,255,.075); --line2:rgba(255,255,255,.12);
  --text:#eef2f6; --text2:#c7d0da; --mute:#8592a0;
  --red:#e5383b; --good:#34c56a; --bad:#ff5a52; --warn:#e7b13b; --blue:#5aa9ff;
  --accL:color-mix(in srgb,var(--acc) 62%,#ffffff);   /* 어두운 구단 컬러도 보이게 밝힌 포인트 */
  --accS:color-mix(in srgb,var(--acc) 22%,transparent);
  --r:12px; --r2:8px;
  --shadow:0 1px 0 rgba(255,255,255,.035) inset,0 10px 30px rgba(0,0,0,.28);
  --font:"Pretendard Variable","Pretendard","SUIT","Apple SD Gothic Neo","Noto Sans KR",-apple-system,"Malgun Gothic",sans-serif;
}
html{scrollbar-color:#2b3540 transparent}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#26303b;border-radius:8px;border:2px solid transparent;background-clip:padding-box}::-webkit-scrollbar-thumb:hover{background:#34404d;background-clip:padding-box}::-webkit-scrollbar-track{background:transparent}
body{font-family:var(--font);font-size:14px;letter-spacing:-.1px;background:var(--bg);font-feature-settings:"tnum" 0}
::selection{background:var(--accS)}
:focus-visible{outline:2px solid var(--accL);outline-offset:2px;border-radius:6px}
/* 버튼 · 입력 */
button{background:rgba(255,255,255,.045);border:1px solid var(--line2);border-radius:var(--r2);color:var(--text);font-weight:600;padding:7px 14px;transition:background .15s,border-color .15s,transform .05s}
button:hover:not(:disabled){background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.2)}
button:active:not(:disabled){transform:translateY(1px)}
button.pri{background:var(--acc);border-color:color-mix(in srgb,var(--acc) 70%,#fff 30%);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--acc) 35%,transparent)}
button.pri:hover:not(:disabled){background:color-mix(in srgb,var(--acc) 85%,#fff);border-color:color-mix(in srgb,var(--acc) 60%,#fff)}
select,input{background:#0d1218;border:1px solid var(--line2);border-radius:var(--r2);color:var(--text);padding:7px 11px}
select:hover,input:hover{border-color:rgba(255,255,255,.2)}
input::placeholder{color:#65717e}
/* 배경 */
#app{background:
  radial-gradient(900px 380px at 12% -160px,color-mix(in srgb,var(--acc) 26%,transparent),transparent 70%),
  radial-gradient(800px 500px at 100% 0,rgba(90,169,255,.06),transparent 70%),
  linear-gradient(180deg,var(--bg2),var(--bg) 600px)}
/* 상단 바 */
.tb1{height:62px;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 58%,#0b0f14) 0%,color-mix(in srgb,var(--acc) 22%,#0e1218) 38%,#0e1218 70%);border-bottom:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.35)}
.tb1::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--acc),transparent 60%)}
.tb1 .hist button{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);font-size:20px}
.menu>button{height:62px;font-size:15px;font-weight:700;letter-spacing:-.2px;opacity:.8;padding:0 13px}
.menu>button:hover,.menu:focus-within>button{background:rgba(255,255,255,.06)}
.menu.on>button{opacity:1;box-shadow:inset 0 -3px 0 var(--accL)}
.dd{top:62px;border-radius:12px;margin-top:6px;padding:6px;background:rgba(17,22,29,.97);backdrop-filter:blur(14px);border:1px solid var(--line2);box-shadow:0 18px 40px rgba(0,0,0,.55)}
.dd::before{content:"";position:absolute;left:0;right:0;top:-8px;height:8px}
.dd a{border-radius:8px;padding:9px 12px}
.dd a:hover{background:rgba(255,255,255,.06)}
.dd a.on{box-shadow:none;background:var(--accS);color:#fff}
.datebox{background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:12px;padding:6px 8px 6px 14px;backdrop-filter:blur(8px)}
.datebox b{font-size:14.5px;letter-spacing:-.2px}
.datebox span{color:var(--text2);opacity:1}
.datebox .rec{background:rgba(255,255,255,.1);color:#fff;border-radius:8px;padding:4px 9px}
.cont{height:42px;gap:6px}
.cont button{border-radius:10px;background:rgba(255,255,255,.06);border-color:var(--line2);font-size:13.5px}
.cont .go{min-width:168px;background:linear-gradient(135deg,var(--acc),color-mix(in srgb,var(--acc) 70%,#000));border-color:color-mix(in srgb,var(--acc) 55%,#fff);color:#fff;font-size:15.5px;font-weight:800;box-shadow:0 6px 20px color-mix(in srgb,var(--acc) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.2)}
.cont .go:hover:not(:disabled){background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 85%,#fff),var(--acc));border-color:#fff}
.cont .go span{opacity:.8;letter-spacing:-3px}
.cont .go.live{background:linear-gradient(135deg,#ff4d4f,#c3122e);border-color:#ff8a8a;animation:livepulse 2s infinite}
@keyframes livepulse{0%,100%{box-shadow:0 0 0 0 rgba(255,77,79,.45)}50%{box-shadow:0 0 0 7px rgba(255,77,79,0)}}
.tb2{height:44px;background:rgba(9,12,17,.78);backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--line)}
.subtabs{gap:2px}
.subtabs a{font-size:13.5px;color:var(--mute);padding:0 12px;font-weight:600}
.subtabs a.on{color:#fff;box-shadow:inset 0 -2px 0 var(--accL)}
.subtabs .crumb{font-size:13.5px;letter-spacing:-.2px;border-right-color:var(--line2)}
.quick button{background:rgba(255,255,255,.04);border-color:var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--text2)}
.quick button:hover{color:#fff}
.quick .n{background:var(--red)}
/* 콘텐츠 · 패널 */
.content{padding:26px 28px 10px;max-width:1640px}
#content>*{animation:fadeUp .22s ease-out both}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-size:26px;font-weight:800;letter-spacing:-.6px;margin:0 0 18px}
h3{font-size:13.5px;font-weight:700;color:var(--text2);letter-spacing:-.1px}
.panel,.card,.cl-tile,.lvcard,.tcard{background:linear-gradient(180deg,rgba(255,255,255,.028),rgba(255,255,255,.008)) ,var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel,.card{padding:18px}
.panel>h3,.card>h3{gap:10px;margin-bottom:14px}
.panel>h3::before,.card>h3::before{content:"";width:3px;height:14px;border-radius:2px;background:var(--accL);flex:none;margin-right:-2px}
.panel>h3,.card>h3{justify-content:flex-start;flex-wrap:wrap}
.panel>h3>button,.panel>h3>.lnk,.panel>h3>select,.card>h3>button,.card>h3>select{margin-left:auto}
#content>.hero:not(:first-child){margin-top:6px;border-top:1px solid var(--line)}
.lnk{text-decoration:none;color:#fff;font-size:13.5px;border-bottom:1px solid color-mix(in srgb,var(--accL) 70%,transparent);padding-bottom:1px}
.lnk:hover{color:var(--accL)}
.eyebrow{color:var(--accL);letter-spacing:3px;font-size:11.5px;font-weight:700}
.grid{gap:18px}
/* 표 */
table{font-size:13.5px}
th,td{border-bottom:1px solid rgba(255,255,255,.05);padding:9px 10px}
th{background:#0e1319;color:#7f8c9a;font-size:11.5px;font-weight:700;letter-spacing:.2px;text-transform:none;border-bottom:1px solid var(--line2)}
th:hover{color:#c7d0da}
tbody tr:hover td,.cl-tbl tbody tr:hover td{background:rgba(255,255,255,.035)}
tr.me td,.cl-tbl tr.me td{background:var(--accS)}
tr.me td:first-child{box-shadow:inset 3px 0 0 var(--accL)}
.cl-tbl th{background:#0e1319;border-bottom:1px solid var(--line2)}
.cl-tbl td{border-bottom-color:rgba(255,255,255,.05)}
/* 작은 요소 */
.pill{background:rgba(255,255,255,.05);border-color:var(--line2);color:var(--text2);font-weight:600;padding:2px 10px}
.pill.tr{background:rgba(90,169,255,.1);border-color:rgba(90,169,255,.35);color:#b6d8ff}
.pill.bad{background:rgba(255,90,82,.1);border-color:rgba(255,90,82,.35);color:#ffb3ad}
.tag{border-radius:6px;font-size:11.5px;letter-spacing:.2px;padding:3px 8px;background:rgba(52,197,106,.16);color:#8ff0b4;border:1px solid rgba(52,197,106,.35)}
.tag.me{background:var(--acc);color:#fff;border-color:transparent}
.tag.inj{background:rgba(231,140,59,.18);color:#ffc58f;border-color:rgba(231,140,59,.4)}
.tag.fo{background:rgba(90,169,255,.14);color:#b6d8ff;border-color:rgba(90,169,255,.35)}
.r{border-radius:6px;font-size:12px;min-width:28px;padding:2px 5px;box-shadow:inset 0 -1px 0 rgba(0,0,0,.2)}
.bar,.cl-bar{height:6px;background:rgba(255,255,255,.07);border-radius:6px}
.bar i,.cl-bar i{border-radius:6px;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 70%,#000),var(--accL))}
.meter{grid-template-columns:96px 1fr 34px;margin:9px 0}
.meter b{text-align:right;font-variant-numeric:tabular-nums}
.stars .bg{color:#2c3540}.stars .fg{color:#f5c451}
.grade{width:32px;height:32px;border-width:2px;background:rgba(0,0,0,.2)}
.cl-chip{background:rgba(255,255,255,.07);border:1px solid var(--line)}
.cl-steps span{background:rgba(255,255,255,.05);border:1px solid var(--line)}
.cl-steps span.on{border-color:transparent}
.cl-tile{padding:14px 16px}
.cl-tile .k,.tile .k{font-size:11.5px;letter-spacing:.2px;color:var(--mute);font-weight:600}
.cl-tile .v{font-size:24px;letter-spacing:-.5px}
.tile{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px}
.big2{color:var(--accL)}
.foot{color:#5f6b78;padding:18px 28px 28px}
/* 홈 */
.mtabs button{border-radius:999px;font-size:12.5px;padding:5px 12px}
.mtabs button.on{background:var(--accS);border-color:color-mix(in srgb,var(--accL) 50%,transparent);color:#fff}
.dhead{background:transparent;color:#6f7c8a;font-size:11.5px;font-weight:700;letter-spacing:.3px;padding:12px 14px 6px;border-bottom:0}
.msg{border-radius:10px;margin:2px 0;border-bottom:0;border-left-width:3px}
.msg:hover{background:rgba(255,255,255,.045)}
.msg.unread{background:rgba(255,255,255,.025)}
.msg .t{font-size:14.5px;font-weight:600}
.msg .chip{border-color:var(--line2);border-radius:999px;padding:0 8px;font-size:11px}
.news-hero{border-color:var(--line);border-radius:14px;transition:transform .15s,border-color .15s}
.news-hero:hover{border-color:var(--line2);transform:translateY(-1px)}
.news-hero .sb{background:radial-gradient(400px 160px at 50% 0,color-mix(in srgb,var(--acc) 30%,transparent),transparent),linear-gradient(180deg,#1b232e,#10151c)}
.news-hero .sc2{font-size:56px;letter-spacing:-2px;text-shadow:0 6px 24px rgba(0,0,0,.4)}
.mrow{border-bottom-color:rgba(255,255,255,.05);border-radius:8px}
.mrow .v{background:rgba(255,255,255,.04);border-color:var(--line);border-radius:999px}
.week .d{background:rgba(255,255,255,.03);border-color:var(--line);border-radius:10px}
.week .d.today{border-color:var(--accL);background:var(--accS);box-shadow:none}
/* 선수·코치 프로필 */
.hero{background:radial-gradient(700px 260px at 0 0,color-mix(in srgb,var(--acc) 45%,transparent),transparent 70%),linear-gradient(180deg,rgba(255,255,255,.03),transparent);border-bottom:1px solid var(--line);padding:26px 28px 22px;margin:-26px -28px 22px}
.hero .nm h1{font-size:38px;letter-spacing:-1px}
.hero .box{border-left-color:var(--line2)}
.hero>svg{box-shadow:0 10px 30px rgba(0,0,0,.45);border-radius:16px!important}
.act>summary{background:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 60%,#fff);border-radius:10px;box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 35%,transparent)}
.act[open]>div{border-radius:12px;border-color:var(--line2);background:rgba(17,22,29,.98)}
.pbody>div{border-right-color:var(--line)}
.ah{font-size:11.5px;font-weight:700;letter-spacing:.3px;color:#7f8c9a;border-bottom-color:var(--line)}
.at{border-radius:6px;margin:1px 0;padding:7px 10px}
.at:nth-child(odd){background:rgba(255,255,255,.022)}
.at.key{background:linear-gradient(90deg,rgba(52,197,106,.18),rgba(52,197,106,.05));border-left-color:var(--good)}
.role{border-radius:8px}
.role.on{background:var(--accS);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accL) 35%,transparent)}
.stack{height:12px;border-radius:999px;background:rgba(255,255,255,.07)}
/* 모달 · 토스트 계열 */
.modal{background:rgba(4,6,9,.72);backdrop-filter:blur(6px)}
.modal>div{border-radius:16px;border:1px solid var(--line2);box-shadow:0 30px 80px rgba(0,0,0,.6)}
/* 중계 */
.lvwrap{background:radial-gradient(900px 400px at 50% 0,color-mix(in srgb,var(--acc) 18%,transparent),transparent),rgba(6,8,12,.96);backdrop-filter:blur(6px)}
/* 타이틀 화면 */
.title{background:#06080c}
.title svg.bg{opacity:.55;filter:saturate(.8)}
.title::before{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(900px 520px at 50% 38%,rgba(229,56,59,.22),transparent 70%),linear-gradient(180deg,rgba(6,8,12,.35),rgba(6,8,12,.2) 40%,rgba(6,8,12,.92))}
.title .inner{z-index:2;padding:15vh 20px 0;display:flex;flex-direction:column;align-items:center}
.title .sub{font-size:17px;color:#c7d0da;font-weight:500;margin:22px 0 4px;letter-spacing:-.2px}
.title .btns{margin-top:30px;gap:12px;flex-wrap:wrap}
.title .btns button,.title .btns label{min-width:180px;justify-content:center;padding:14px 30px!important;font-size:16px!important;font-weight:800!important;border-radius:12px!important}
.title .btns .pri{background:linear-gradient(135deg,#ff4d4f,#c3122e);border-color:#ff8a8a;box-shadow:0 10px 30px rgba(229,56,59,.4)}
.title .btns .dark,.title .btns label{background:rgba(255,255,255,.06)!important;border:1px solid rgba(255,255,255,.18)!important;backdrop-filter:blur(8px)}
.title .tf{z-index:2;color:#7d8996;font-size:12.5px}
.pmlogo{display:flex;align-items:center;gap:calc(var(--w)*.04);max-width:100%}
.pmlogo>svg{filter:drop-shadow(0 18px 40px rgba(229,56,59,.35))}
.pmlogo .wm{display:flex;flex-direction:column;align-items:flex-start;text-align:left}
.pmlogo .en{font-size:calc(var(--w)*.022);letter-spacing:.42em;color:#8d99a6;font-weight:700}
.pmlogo .ko{font-size:calc(var(--w)*.105);font-weight:900;letter-spacing:-.04em;line-height:1.05;color:#fff;background:linear-gradient(180deg,#fff,#c9d2dc);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.pmlogo .ed{display:flex;align-items:center;gap:8px;margin-top:calc(var(--w)*.012)}
.pmlogo .ed span{font-size:calc(var(--w)*.04);font-weight:900;letter-spacing:.06em;color:#fff;font-family:"Arial Black",Arial,sans-serif}
.pmlogo .ed b{font-size:calc(var(--w)*.032);font-weight:900;color:#fff;background:linear-gradient(135deg,#ff4d4f,#c3122e);padding:2px 12px;border-radius:999px;letter-spacing:.12em;font-family:"Arial Black",Arial,sans-serif}
.teams{gap:18px}
.tcard{padding:22px;border-radius:16px;position:relative;overflow:hidden}
.tcard::before{content:"";position:absolute;inset:0 0 auto 0;height:120px;background:radial-gradient(260px 120px at 50% 0,color-mix(in srgb,var(--c) 40%,transparent),transparent);pointer-events:none}
.tcard>*{position:relative}
.tcard:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--c) 70%,#fff);box-shadow:0 18px 40px rgba(0,0,0,.45)}
@media (max-width:760px){
  .pmlogo{flex-direction:column;gap:10px;text-align:center}.pmlogo .wm{align-items:center}
  .pmlogo .ko{font-size:44px}.pmlogo .en{font-size:11px}.pmlogo .ed span{font-size:22px}.pmlogo .ed b{font-size:16px}
  .hero{margin:-14px -14px 14px;padding:18px 16px}
  .content{padding:16px 14px}
}
@media (prefers-reduced-motion:reduce){ #content>*,.cont .go.live{animation:none} }
</style>
